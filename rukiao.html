<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据资源入表公共服务平台</title>
  <style>
    :root {
      --primary: #1E3A8A;
      --primary-light: #3B5BB5;
      --primary-bg: #EEF1F9;
      --bg-page: #FFFFFF;
      --bg-section: #F1F5F9;
      --text-primary: #0A1628;
      --text-secondary: #475569;
      --text-tertiary: #64748B;
      --border: #E2E8F0;
      --border-light: #EDF2F7;
      --footer-bg: #1A1A2E;
      --footer-text: #8888A8;
      --white: #FFFFFF;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-primary);
      background: var(--bg-page);
      line-height: 1.5;
      min-width: 320px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 80px;
    }

    /* 导航栏 */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
    }

    .navbar-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateX(-80px);
      flex-shrink: 0;
    }

    .nav-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-width: 0;
    }

    .nav-right {
      flex-shrink: 0;
      margin-left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-search {
      display: none;
      align-items: center;
      gap: 8px;
      width: 320px;
      max-width: 100%;
      padding: 8px 14px;
      background: #F5F7FA;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      transition: border-color 0.2s, background 0.2s;
    }

    .nav-search:not([hidden]) {
      display: flex;
    }

    .nav-search:focus-within {
      background: #fff;
      border-color: var(--primary-light);
    }

    .nav-search .search-icon {
      width: 16px;
      height: 16px;
      color: #94A3B8;
      flex-shrink: 0;
    }

    .nav-search input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: var(--text-primary);
      min-width: 0;
    }

    .nav-search input::placeholder {
      color: #94A3B8;
    }

    .btn-workbench {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: #fff;
      color: var(--primary-light);
      border: 1px solid #E2E8F0;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .btn-workbench:not([hidden]) {
      display: flex;
    }

    .btn-workbench:hover {
      background: var(--primary-bg);
      border-color: var(--primary-light);
    }

    .btn-workbench svg {
      width: 16px;
      height: 16px;
    }

    .logo-img {
      width: 27px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 600;
      color: #1E3A8A;
      white-space: nowrap;
    }

    .nav-menu {
      display: none;
      align-items: center;
      gap: 32px;
    }

    .nav-menu:not([hidden]) {
      display: flex;
    }

    .nav-link {
      font-size: 14px;
      color: var(--text-secondary);
      transition: color 0.2s;
      white-space: nowrap;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--primary-light);
    }

    /* 侧边栏 */
    .side-bar {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-item {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-full);
      background: var(--white);
      color: var(--text-secondary);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
    }

    .side-item:hover {
      background: var(--primary-light);
      color: var(--white);
      border-color: var(--primary-light);
    }

    .side-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .side-icon svg {
      width: 22px;
      height: 22px;
    }

    .side-label {
      max-width: 0;
      opacity: 0;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: max-width 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
    }

    .side-item:hover .side-label {
      max-width: 80px;
      opacity: 1;
      margin-left: 4px;
    }

    .side-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 300;
      padding: 12px 24px;
      background: rgba(26, 26, 46, 0.92);
      color: var(--white);
      font-size: 14px;
      border-radius: var(--radius-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }

    .side-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .nav-item-has-dropdown {
      position: relative;
      display: flex;
      align-items: center;
    }

    .nav-dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      min-width: 160px;
      margin-top: 8px;
      padding: 8px 0;
      background: var(--white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .nav-item-has-dropdown:hover .nav-dropdown {
      opacity: 1;
      visibility: visible;
    }

    .nav-dropdown-item {
      display: block;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }

    .nav-dropdown-item:hover {
      background: var(--primary-bg);
      color: var(--primary-light);
    }

    .nav-dropdown-item.current {
      color: var(--primary-light);
      font-weight: 600;
      background: var(--primary-bg);
    }

    .nav-dropdown-item.current::after {
      content: '✓';
      margin-left: 8px;
      font-weight: 700;
    }

    .btn-primary {
      display: inline-block;
      background: var(--primary-light);
      color: var(--white);
      padding: 8px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Hero */
    .hero {
      position: relative;
      width: 100%;
      min-height: 480px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(59, 91, 181, 0.10), transparent 70%);
      pointer-events: none;
    }

    .hero-slider {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      background-size: cover;
      background-position: right center;
      background-repeat: no-repeat;
    }

    .hero-slide.active {
      opacity: 1;
    }

    .hero-experience-btn {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      z-index: 4;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 13px 30px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #1E3A8A, #3B5BB5);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(30, 58, 138, 0.35);
      transition: background 0.25s, box-shadow 0.25s;
    }

    .hero-experience-btn:hover {
      background: linear-gradient(135deg, #3B5BB5, #5568C4);
      box-shadow: 0 10px 26px rgba(30, 58, 138, 0.45);
    }

    .hero-slide.active .hero-experience-btn {
      display: inline-flex;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1440px;
      height: 100%;
      min-height: 480px;
      margin: 0 auto;
      padding: 0 80px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 520px;
      text-align: left;
    }

    .hero-title,
    .hero-subtitle {
      text-align: left;
    }

    .hero-dots {
      position: static;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .hero-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(30, 58, 138, 0.35);
      border: 1px solid rgba(30, 58, 138, 0.45);
      cursor: pointer;
      transition: all 0.3s;
    }

    .hero-dot.active {
      width: 28px;
      border-radius: 999px;
      background: var(--primary-light);
      border-color: var(--primary-light);
    }

    /* 统计栏（含轮播指示器） */
    .stats {
      position: relative;
      z-index: 10;
      padding: 32px 0 40px;
      background: transparent;
    }

    .stats-dots {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* 平台概况（数据要素跨境） */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 20px;
      margin-bottom: 48px;
    }

    .cross-border-top {
      padding-top: 40px;
    }

    .overview-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 8px 24px rgba(30, 58, 138, 0.08);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .overview-card .oc-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1E3A8A, #3B5BB5);
      flex-shrink: 0;
    }

    .overview-card .oc-num {
      font-size: 30px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .overview-card .oc-label {
      font-size: 15px;
      color: #555;
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    /* 数据登记动态表格 */
    .registry-section {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px 32px;
      box-shadow: 0 8px 24px rgba(30, 58, 138, 0.08);
      margin-bottom: 48px;
    }

    .registry-table-wrap {
      overflow-x: auto;
      max-height: 420px;
      overflow-y: auto;
    }

    .registry-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      white-space: nowrap;
    }

    .registry-table th,
    .registry-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #eef1f6;
    }

    .registry-table th {
      position: sticky;
      top: 0;
      background: #EDF1F8;
      color: var(--primary);
      font-weight: 600;
      z-index: 1;
    }

    .registry-table tbody tr:hover {
      background: #F4F6FB;
    }

    /* 入表占位 */
    .placeholder-block {
      margin: 60px auto;
      max-width: 900px;
      min-height: 320px;
      border: 2px dashed #c3d0e6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a97ad;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.5);
    }

    /* 通用平台板块标题 */
    .platform-section-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--primary);
      text-align: center;
      margin: 48px 0 32px;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .hero-subtitle {
      font-size: 15px;
      line-height: 1.625;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    /* 统计栏 */
    .stats {
      position: relative;
      z-index: 10;
      padding: 0 0 40px;
      background: transparent;
      margin-top: -72px;
    }

    .stats-dots {
      display: flex;
      justify-content: center;
      margin-top: 44px;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .stat-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 32px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--primary-light);
      flex-shrink: 0;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-light);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    /* 区块标题 */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--primary);
      margin-bottom: 40px;
      text-align: center;
    }

    .section-title .icon {
      font-size: 20px;
    }

    /* 我要加入 */
    .join-section {
      padding: 64px 0;
      background: var(--bg-page);
    }

    .join-tabs {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .join-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 500;
      transition: all 0.25s;
    }

    .join-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .join-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
    }

    .join-tab-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .join-panel {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .join-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .join-card {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px;
      background: var(--white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
    }

    .join-flowchart {
      margin-bottom: 24px;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-section);
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-tertiary);
      font-size: 16px;
      font-weight: 500;
    }

    .join-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .join-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .join-card-icon svg {
      width: 22px;
      height: 22px;
    }

    .join-card-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .join-card-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
      letter-spacing: 0.05em;
    }

    .join-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-outline {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-size: 14px;
      font-weight: 500;
      background: var(--white);
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: var(--primary-bg);
    }

    /* 热门推荐 */
    .recommend {
      padding: 64px 0;
      background: var(--bg-section);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-tags {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      max-height: 42px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .filter-tags.expanded {
      max-height: 150px;
    }

    .filter-tag {
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--white);
      color: var(--text-secondary);
      font-size: 14px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tag:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-tag.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    .filter-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--white);
      color: var(--primary-light);
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .filter-toggle svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s;
    }

    .filter-toggle.expanded svg {
      transform: rotate(180deg);
    }

    .recommend-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .recommend-card {
      background: linear-gradient(135deg, rgba(238, 241, 249, 0.7) 0%, var(--white) 100%);
      border-radius: var(--radius-xl);
      padding: 28px;
      border: 1px solid var(--border-light);
    }

    .recommend-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .recommend-card-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .recommend-card-arrow {
      color: var(--primary-light);
      font-size: 18px;
      font-weight: 700;
    }

    .recommend-list {
      display: flex;
      flex-direction: column;
    }

    .recommend-item {
      display: flex;
      gap: 12px;
      padding: 16px 4px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.5);
    }

    .recommend-item:last-child {
      border-bottom: none;
    }

    .recommend-thumb {
      width: 80px;
      height: 60px;
      border-radius: var(--radius-md);
      background: #E4E9F6;
      flex-shrink: 0;
    }

    .recommend-item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .recommend-item-desc {
      font-size: 13px;
      color: var(--text-tertiary);

  <script>
    // 我要加入 Tab 切换
    const joinTabs = document.querySelectorAll('.join-tab');
    const joinPanels = document.querySelectorAll('.join-panel');

    joinTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.tab;

        joinTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        joinPanels.forEach(panel => {
          panel.classList.toggle('active', panel.id === 'panel-' + target);
        });
      });
    });

    // 热门推荐筛选标签
    const filterTags = document.querySelectorAll('.filter-tag');
    filterTags.forEach(tag => {
      tag.addEventListener('click', () => {
        filterTags.forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
      });
    });

    // 初始平台（单一站点，无平台切换）
    const currentPlatformName = '可信数据空间';

    // 侧边栏功能
    const sideItems = document.querySelectorAll('.side-item');
    const sideToast = document.getElementById('sideToast');
    const sideToastMessages = {
      publish: '发布需求（占位）',
      cart: '购物车（占位）',
      service: '联系客服（占位）'
    };
    let sideToastTimer = null;

    sideItems.forEach(item => {
      item.addEventListener('click', () => {
        const action = item.dataset.action;
        sideToast.textContent = sideToastMessages[action] || '占位功能';
        sideToast.classList.add('show');
        clearTimeout(sideToastTimer);
        sideToastTimer = setTimeout(() => {
          sideToast.classList.remove('show');
        }, 2000);
      });
    });

    // Hero 轮播
    (function initHeroSlider() {
      const slides = document.querySelectorAll('.hero-slide');
      const dotsContainer = document.getElementById('heroDots');
      let current = 0;
      let autoTimer = null;

      if (!slides.length) return;

      slides.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.className = 'hero-dot' + (index === 0 ? ' active' : '');
        dot.setAttribute('aria-label', '切换到第' + (index + 1) + '张');
        dot.addEventListener('click', () => goTo(index));
        dotsContainer.appendChild(dot);
      });

      const dots = dotsContainer.querySelectorAll('.hero-dot');

      window.heroAutoEnabled = (currentPlatformName === '可信数据空间');

      function goTo(index) {
        if (index === current) return;
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = index;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
        resetAutoPlay();
      }

      function next() {
        if (!window.heroAutoEnabled) return;
        goTo((current + 1) % slides.length);
      }

      function resetAutoPlay() {
        clearInterval(autoTimer);
        if (window.heroAutoEnabled) {
          autoTimer = setInterval(next, 5000);
        }
      }

      // 立即体验按钮：滚动到首页板块
      slides.forEach(slide => {
        const btn = slide.querySelector('.hero-experience-btn');
        if (!btn) return;
        btn.addEventListener('click', () => {
          const target = document.querySelector('#homeSections');
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        });
      });

      resetAutoPlay();
    })();
  </script>
